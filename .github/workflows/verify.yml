name: Verify

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [api, web]
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml

      - name: Instalar dependências
        working-directory: ${{ matrix.project }}
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        if: matrix.project == 'api'
        working-directory: api
        run: pnpm exec prisma generate

      - name: Rodar testes
        if: matrix.project == 'api'
        working-directory: api
        env:
          SECRET_KEY: verify-ci-dummy-secret-key
        run: pnpm exec vitest run

      - name: Build (api)
        if: matrix.project == 'api'
        working-directory: api
        run: pnpm run build

      - name: Typecheck (api, filtrado a src/)
        if: matrix.project == 'api'
        working-directory: api
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set +e
          output="$(pnpm exec tsc --noEmit 2>&1)"
          exit_code=$?
          set -e
          echo "$output"
          if echo "$output" | grep -E '^src/' > /dev/null; then
            echo "Erros de tipo encontrados em src/"
            exit 1
          fi
          if [ "$exit_code" -ne 0 ] && ! echo "$output" | grep -Eq 'error TS[0-9]+'; then
            echo "tsc falhou (exit $exit_code) sem nenhum diagnóstico 'error TS<n>' — provável crash/OOM/config inválida, tratando como falha"
            exit "$exit_code"
          fi
          echo "Nenhum erro de tipo em src/ (erros fora de src/, ex. prisma/generated, são ignorados deliberadamente)."

      - name: Build (web, env dummy)
        if: matrix.project == 'web'
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: https://dummy.invalid
        run: pnpm run build

      - name: Typecheck (web)
        if: matrix.project == 'web'
        working-directory: web
        run: pnpm exec tsc --noEmit --incremental false

  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: verify_shadow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/verify_shadow
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/verify_shadow
    steps:
      - name: Checkout do código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Instalar dependências
        working-directory: api
        run: pnpm install --frozen-lockfile

      - name: Aplicar migrations num banco vazio
        working-directory: api
        run: pnpm exec prisma migrate deploy

      - name: Verificar drift entre migrations e schema
        working-directory: api
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/schema/migrations \
            --to-schema-datamodel ./prisma/schema \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
