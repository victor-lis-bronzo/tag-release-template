name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a deployar/rollback (ex.: v1.1.0)'
        required: true
      skip_migrations:
        description: 'Pular migrate deploy e migration-dryrun (uso: rollback)'
        type: boolean
        default: false
      skip_verify:
        description: 'Pular build/typecheck/teste (uso: rollback de emergência)'
        type: boolean
        default: false
      confirm:
        description: 'Digite "yes" para confirmar'
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm == 'yes' }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Restaurar objetos de tag anotada
        # actions/checkout pode materializar a tag como ref leve no runner; refaz o fetch para garantir o objeto anotado real.
        run: git fetch --force --tags origin

      - name: Resolver e validar a tag
        id: resolve
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' não segue o padrão SemVer vX.Y.Z"
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag '$TAG' não existe no repositório"
            exit 1
          fi

          tag_type="$(git cat-file -t "refs/tags/$TAG")"
          if [ "$tag_type" != "tag" ]; then
            echo "Tag '$TAG' é leve (tipo '$tag_type'); só tags anotadas são aceitas"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    if: ${{ !inputs.skip_verify }}
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  backup:
    needs: [resolve, verify]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.verify.result != 'failure' }}
    uses: ./.github/workflows/_backup.yml
    secrets: inherit

  migration-dryrun:
    needs: [resolve, backup]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.backup.result == 'success' && !inputs.skip_migrations }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar SSH
        uses: ./.github/actions/setup-ssh
        with:
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Dry-run das migrations contra cópia do banco real
        env:
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          SSH_TARGET: ${{ vars.SSH_TARGET }}
          MIGRATION_DRYRUN_DB: ${{ vars.MIGRATION_DRYRUN_DB }}
          BACKUP_DUMP_DIR: ${{ vars.BACKUP_DUMP_DIR }}
          BACKUP_DUMP_PREFIX: ${{ vars.BACKUP_DUMP_PREFIX }}
          API_DEPLOY_PATH: ${{ vars.API_DEPLOY_PATH }}
          NODE_VERSION: ${{ vars.NODE_VERSION }}
        run: |
          # shellcheck disable=SC2029
          ssh "$SSH_TARGET" 'bash -euo pipefail -s' \
            "$DB_ROOT_PASSWORD" "$MIGRATION_DRYRUN_DB" "$BACKUP_DUMP_DIR" "$BACKUP_DUMP_PREFIX" "$API_DEPLOY_PATH" "$NODE_VERSION" << 'EOF'
            set -euo pipefail
            DB_ROOT_PASSWORD="$1"
            scratch_db="$2"
            dump_dir="$3"
            dump_prefix="$4"
            api_deploy_path="$5"
            node_version="$6"
            export MYSQL_PWD="$DB_ROOT_PASSWORD"
            latest_dump="$(ls -t "$dump_dir"/"$dump_prefix"-*.sql.gz 2>/dev/null | head -n1 || true)"

            if [ -z "$latest_dump" ]; then
              echo "Nenhum dump encontrado em $dump_dir (padrão $dump_prefix-*.sql.gz)"
              exit 1
            fi

            mysql -h127.0.0.1 -P3306 -uroot \
              -e "DROP DATABASE IF EXISTS $scratch_db; CREATE DATABASE $scratch_db;"
            gunzip -c "$latest_dump" | mysql -h127.0.0.1 -P3306 -uroot "$scratch_db"

            cd "$api_deploy_path"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use "$node_version"

            export DATABASE_URL="mysql://root:${DB_ROOT_PASSWORD}@127.0.0.1:3306/$scratch_db"
            export SHADOW_DATABASE_URL="$DATABASE_URL"

            time pnpm exec prisma migrate deploy
            pnpm exec prisma migrate diff \
              --from-migrations ./prisma/schema/migrations \
              --to-schema-datamodel ./prisma/schema \
              --shadow-database-url "$SHADOW_DATABASE_URL" \
              --exit-code

            mysql -h127.0.0.1 -P3306 -uroot -e "DROP DATABASE $scratch_db;"
          EOF
        # Dump esperado em "$BACKUP_DUMP_DIR/$BACKUP_DUMP_PREFIX-<DATA>.sql.gz",
        # gerado pelo script de backup do banco (mysqldump + gzip, achatado,
        # sem rotação). DB_ROOT_PASSWORD vem do secret DB_ROOT_PASSWORD.

  deploy:
    needs: [resolve, verify, backup, migration-dryrun]
    if: >-
      ${{ !cancelled()
          && needs.resolve.result == 'success'
          && needs.verify.result != 'failure'
          && needs.backup.result == 'success'
          && needs['migration-dryrun'].result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar SSH
        uses: ./.github/actions/setup-ssh
        with:
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Checkout da tag e deploy da API
        env:
          TAG: ${{ env.TAG }}
          SSH_TARGET: ${{ vars.SSH_TARGET }}
          NODE_VERSION: ${{ vars.NODE_VERSION }}
          API_DEPLOY_PATH: ${{ vars.API_DEPLOY_PATH }}
          DEPLOY_GIT_REMOTE: ${{ vars.DEPLOY_GIT_REMOTE }}
          SCRIPTS_DIR: ${{ vars.SCRIPTS_DIR }}
        run: |
          # shellcheck disable=SC2029
          ssh "$SSH_TARGET" 'bash -euo pipefail -s' \
            "$TAG" "$NODE_VERSION" "$API_DEPLOY_PATH" "$DEPLOY_GIT_REMOTE" "$SCRIPTS_DIR" << 'EOF'
            TAG="$1"
            node_version="$2"
            root="$3"
            git_remote="$4"
            scripts_dir="$5"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use "$node_version"

            workdir="$root"
            cd "$root"

            git remote set-url origin "$git_remote"

            prev="$(git -C "$root" describe --tags --exact-match 2>/dev/null || git -C "$root" rev-parse HEAD)"
            echo "$prev" > "$scripts_dir/last-release-$(basename "$workdir").txt"

            git -C "$root" diff --quiet HEAD -- || { echo "worktree suja"; exit 1; }
            git -C "$root" fetch --prune --prune-tags --tags --force origin
            git -C "$root" checkout --detach --force "refs/tags/$TAG"

            pnpm install --frozen-lockfile
            pnpm exec prisma generate
            pnpm run build
            pnpm exec prisma migrate deploy
          EOF

      - name: Checkout da tag e deploy do Frontend Web
        env:
          TAG: ${{ env.TAG }}
          SSH_TARGET: ${{ vars.SSH_TARGET }}
          NODE_VERSION: ${{ vars.NODE_VERSION }}
          WEB_DEPLOY_PATH: ${{ vars.WEB_DEPLOY_PATH }}
          DEPLOY_GIT_REMOTE: ${{ vars.DEPLOY_GIT_REMOTE }}
          SCRIPTS_DIR: ${{ vars.SCRIPTS_DIR }}
        run: |
          # shellcheck disable=SC2029
          ssh "$SSH_TARGET" 'bash -euo pipefail -s' \
            "$TAG" "$NODE_VERSION" "$WEB_DEPLOY_PATH" "$DEPLOY_GIT_REMOTE" "$SCRIPTS_DIR" << 'EOF'
            TAG="$1"
            node_version="$2"
            root="$3"
            git_remote="$4"
            scripts_dir="$5"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use "$node_version"

            workdir="$root"
            cd "$root"

            git remote set-url origin "$git_remote"

            prev="$(git -C "$root" describe --tags --exact-match 2>/dev/null || git -C "$root" rev-parse HEAD)"
            echo "$prev" > "$scripts_dir/last-release-$(basename "$workdir").txt"

            git -C "$root" diff --quiet HEAD -- || { echo "worktree suja"; exit 1; }
            git -C "$root" fetch --prune --prune-tags --tags --force origin
            git -C "$root" checkout --detach --force "refs/tags/$TAG"

            pnpm install --frozen-lockfile
            pnpm run build
          EOF

      - name: Reinicialização dos serviços no PM2
        env:
          SSH_TARGET: ${{ vars.SSH_TARGET }}
          PM2_API_PROCESS: ${{ vars.PM2_API_PROCESS }}
          PM2_WEB_PROCESS: ${{ vars.PM2_WEB_PROCESS }}
        run: |
          # shellcheck disable=SC2029
          ssh "$SSH_TARGET" 'bash -euo pipefail -s' \
            "$PM2_API_PROCESS" "$PM2_WEB_PROCESS" << 'EOF'
            api_process="$1"
            web_process="$2"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            pm2 restart "$api_process"
            pm2 restart "$web_process"
          EOF

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar SSH
        uses: ./.github/actions/setup-ssh
        with:
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Smoke test
        env:
          SSH_TARGET: ${{ vars.SSH_TARGET }}
          API_HEALTHCHECK_PORT: ${{ vars.API_HEALTHCHECK_PORT }}
          WEB_HEALTHCHECK_PORT: ${{ vars.WEB_HEALTHCHECK_PORT }}
        run: |
          # shellcheck disable=SC2029
          ssh "$SSH_TARGET" 'bash -euo pipefail -s' \
            "$API_HEALTHCHECK_PORT" "$WEB_HEALTHCHECK_PORT" << 'EOF'
            api_port="$1"
            web_port="$2"
            sleep 5
            curl -fsS -o /dev/null "http://localhost:$api_port/"
            curl -fsS -o /dev/null "http://localhost:$web_port/"
            if pm2 jlist | grep -q '"status":"errored"'; then
              echo "Há processos em erro no PM2"
              pm2 jlist
              exit 1
            fi
          EOF
